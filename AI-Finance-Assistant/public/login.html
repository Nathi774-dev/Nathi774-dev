<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login your details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
</head>
<body>
    
    <div class="bg-circle one"></div>
    <div class="bg-circle two"></div>

    <div class="container">
        <div class="title">
            <span class="icon">🔑🔐</span>
            <h2>Login</h2>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" placeholder="Enter your email address...">

            <label>Password</label>
            <input id="password" type="password" placeholder="Enter your password...">

            <button class="submit-btn" onclick="login()">Login</button>
        </div>

        <a href="forgot.html" class="auth-link">Forgot your password?</a>
        <a href="signup.html" class="auth-link">Don't Have an Account?</a>
    </div>

    <script src="app.js"></script>
</body>
</html>
