<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Finance Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
</head>
<body>
    <div class="bg-circle one"></div>
    <div class="bg-circle two"></div>

    <div class="dashboard">

        <!-- Naviation bar -->
         <div class="navbar">
            <h2>Dashboard</h2>

            <div class="nav-right">
                <button onlick="location.href='monthly.html'">📊</button>

                <div class="profile">
                    <!-- This is for showing the user's details -->
                    <button onclick="toggleMenu()">👤</button>

                    <div id="dropdown" class="dropdown hidden">
                        <p>Profile</p>
                        <button onclick="logout()">Logout</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Spending Cards -->
        <div class="cards">
            <div class="card income">
                <h3>💵 Income</h3>
                <p id="income">R0</p>
            </div>

            <div class="card expense">
                <h3>💸 Expenses</h3>
                <p id="expense">R0</p>
            </div>

            <div class="card balance">
                <h3>🧾 Balance</h3>
                <p id="balance">R0</p>
            </div>
        </div>

        <!-- The Chatbot section -->
        <div class="dashboard-content">
            <h1>Ask any question related to finances</h1>

            <div class="chat-box">
                <input id="question" placeholder="Ask something...">
                <button onclick="askAI()">▶</button>
            </div>

            <p id="ai-response"></p>
        </div>
    </div>

    <script src="app.js"></script>

    <!-- Script for the toggle menu -->
     <script>
        function toggleMenu() {
            document.getElementById("dropdown").classList.toggle("hidden")
        }

        function logout() {
            localeStorage.removeItem("token");
            window.location.href = "login.html";
        }

        updateCards();
     </script>
</body>
</html>
