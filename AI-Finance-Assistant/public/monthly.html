<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Spending</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <!-- Chart.js for chart functions -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    
    <div class="dashboard">

        <!-- Navigation -->
        <div class="navbar">
            <h2>Monthly Spending</h2>
            <div class="nav-right">
                <button onclick="location.href='dashboard.html'">
                    Home
                </button>

                <div class="profile">
                    <button onclick="toggleMenu()">picture</button>
                    <div id="dropdown" class="dropdown hidden">
                        <p>Profile</p>
                        <button onclick="logout()">Logout</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Graph Section -->
         <div class="dashboard-content">
            <h1>Monthly Expense Overview</h1>

            <canvas id="chart" style="max-width: 600px; margin: auto;"></canvas>
         </div>
    </div>
    <script src="monthly.js"></script>
    <script>
        function toggleMenu(){
            document.getElementById("dropdown").classList.toggle("hidden");
        }

        function logout(){
            localStorage.removeItem("token");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
