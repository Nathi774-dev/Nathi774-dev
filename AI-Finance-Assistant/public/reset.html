<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
</head>
<body>
    <div class="bg-circle one"></div> 
    <div class="bg-circle two"></div> 

    <div class="container">
        <div class="title">
            <span class="icon">🔁</span>
            <h2>Reset your Password</h2>
        </div>

        <p class="subtitle">Enter the code and your New password</p>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email" required>

            <label>Reset Code</label>
            <input id="code" placeholder="Enter security code" required>

            <label>New Password</label>
            <input id="newPassword" type="password" placeholder="Enter new password" required>

            <button class="submit-btn" onclick="resetPassword()">Reset Password</button>
        </div>
        
        <a href="login.html" class="auth-link">Back To Login</a> 
    </div>

    <script src="app.js"></script>
</body>
</html>
